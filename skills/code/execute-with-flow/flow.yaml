execution:
  # Allowed: hotshot, cautious, flow
  mode: cautious

  # Applies only with a VCS; otherwise commits are skipped for the run.
  # Allowed:
  #   never           — Do not commit.
  #   after_each_task — Commit each approved task and any final review fixes.
  #   after_all_tasks — Commit once after all required work is complete.
  commit: after_each_task

  reviews:
    # Each flag independently accepts true or false.
    after_each_task: true
    entire_plan: true

    # Name of an available code review skill; used when either flag above is true.
    skill: self-review
